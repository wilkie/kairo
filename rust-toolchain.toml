# Development toolchain, pinned so a new stable release can't break
# `cargo fmt --check` / `clippy -D warnings` without a code change.
# Bump deliberately (see VERSIONING.md, "Toolchain") and keep the CI
# `toolchain:` input in `.github/workflows/ci.yml` in step.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
