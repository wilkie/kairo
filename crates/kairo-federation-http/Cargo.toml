[package]
name = "kairo-federation-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
axum = "0.7"
kairo-core = { path = "../kairo-core" }
kairo-federation-core = { path = "../kairo-federation-core" }
kairo-identity = { path = "../kairo-identity" }
kairo-statement = { path = "../kairo-statement" }
kairo-store = { path = "../kairo-store" }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
http-body-util = "0.1"
kairo-test-support = { path = "../kairo-test-support" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "kairo_federation_http"
path = "src/lib.rs"

[[bin]]
name = "kairo-federation-http"
path = "src/main.rs"

[lints]
workspace = true
