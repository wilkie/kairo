[package]
name = "kairo-federation-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# `server` is the serving process (axum, tokio); `client` is the
# blocking pull client (ureq + rustls). The CLI depends on `client`
# only; the server binary serves plain HTTP behind a TLS-terminating
# proxy and links no TLS stack of its own when built alone.
[features]
default = ["server", "client"]
server = ["dep:axum", "dep:tokio", "dep:tracing", "dep:tracing-subscriber"]
client = ["dep:kairo-object", "dep:ureq"]

[dependencies]
axum = { version = "0.7", optional = true }
kairo-core = { path = "../kairo-core" }
kairo-federation-core = { path = "../kairo-federation-core" }
kairo-identity = { path = "../kairo-identity" }
kairo-object = { path = "../kairo-object", optional = true }
kairo-statement = { path = "../kairo-statement" }
kairo-store = { path = "../kairo-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"], optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
kairo-test-support = { path = "../kairo-test-support" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lib]
name = "kairo_federation_http"
path = "src/lib.rs"

[[bin]]
name = "kairo-federation-http"
path = "src/main.rs"
required-features = ["server"]

[lints]
workspace = true
