[package]
name = "kairo-daemon-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
kairo-identity = { path = "../kairo-identity" }
kairo-statement = { path = "../kairo-statement" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
kairo-core = { path = "../kairo-core" }
kairo-daemon = { path = "../kairo-daemon" }
kairo-store = { path = "../kairo-store" }
kairo-test-support = { path = "../kairo-test-support" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

[lib]
name = "kairo_daemon_client"
path = "src/lib.rs"

[lints]
workspace = true
