# Brotli, `brotli` and its libraries, shared, in the library directory, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 1.2.1, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "brotli"
summary = "Brotli, built for x86 and x86-64, each release a version tag; this one 1.2.1."
tags = ["brotli"]

[[dependencies]]
kind = "file"
sha256 = "98d35d11a78dc453aebb7d10c3748f3f73ff78c8267c0dc697b8631f67bf7e8f"
path = "distfiles/brotli-1.2.1.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:cmake"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:ninja"

[[build.targets.children]]
name = "brotli-1.2.1"
root = "brotli-1.2.1"
summary = "Brotli 1.2.1 for x86."
tags = ["brotli"]
version = "1.2.1"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:brotli" }, { provides = "tool:brotli" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:cmake"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:ninja"

[[build.targets.children]]
name = "brotli-1.2.1"
root = "brotli-1.2.1"
summary = "Brotli 1.2.1 for x86-64."
tags = ["brotli"]
version = "1.2.1"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:brotli" }, { provides = "tool:brotli" }]
