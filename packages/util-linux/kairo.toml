# util-linux's libuuid, shared, in the library directory, and no other part of util-linux yet, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 2.42.4, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "util-linux"
summary = "util-linux's libuuid, built for x86 and x86-64, each release a version tag; this one 2.42.4."
tags = ["util-linux"]

[[dependencies]]
kind = "file"
sha256 = "fbd62a100ab7bb8746ba0661255c3c48185b1e9021507c624da01fbc696330ec"
path = "distfiles/util-linux-2.42.4.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "libuuid-2.42.4"
root = "libuuid-2.42.4"
summary = "util-linux's libuuid 2.42.4 for x86."
tags = ["util-linux"]
version = "2.42.4"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:uuid" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "libuuid-2.42.4"
root = "libuuid-2.42.4"
summary = "util-linux's libuuid 2.42.4 for x86-64."
tags = ["util-linux"]
version = "2.42.4"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:uuid" }]
