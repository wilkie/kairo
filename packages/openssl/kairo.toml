# OpenSSL, its libraries, shared, in the library directory, and the `openssl` program, its configuration in `/etc/ssl`, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 3.5.9, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "openssl"
summary = "OpenSSL, built for x86 and x86-64, each release a version tag; this one 3.5.9."
tags = ["openssl"]

[[dependencies]]
kind = "file"
sha256 = "603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a"
path = "distfiles/openssl-3.5.9.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:perl"

[[build.targets.children]]
name = "openssl-3.5.9"
root = "openssl-3.5.9"
summary = "OpenSSL 3.5.9 for x86."
tags = ["openssl"]
version = "3.5.9"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "tool:openssl" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:perl"

[[build.targets.children]]
name = "openssl-3.5.9"
root = "openssl-3.5.9"
summary = "OpenSSL 3.5.9 for x86-64."
tags = ["openssl"]
version = "3.5.9"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "tool:openssl" }]
