# Ninja, the build system, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 1.13.2, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "ninja"
summary = "Ninja, built for x86 and x86-64, each release a version tag; this one 1.13.2."
tags = ["ninja"]

[[dependencies]]
kind = "file"
sha256 = "974d6b2f4eeefa25625d34da3cb36bdcebe7fbce40f4c16ac0835fd1c0cbae17"
path = "distfiles/ninja-1.13.2.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:python"

[[build.targets.children]]
name = "ninja-1.13.2"
root = "ninja-1.13.2"
summary = "Ninja 1.13.2 for x86."
tags = ["ninja"]
version = "1.13.2"
requires = [{ provides = "lib:stdc++:shared" }, { provides = "lib:gcc:shared" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:ninja" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:python"

[[build.targets.children]]
name = "ninja-1.13.2"
root = "ninja-1.13.2"
summary = "Ninja 1.13.2 for x86-64."
tags = ["ninja"]
version = "1.13.2"
requires = [{ provides = "lib:stdc++:shared" }, { provides = "lib:gcc:shared" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:ninja" }]
