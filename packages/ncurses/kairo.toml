# ncurses, its wide-character libraries, shared, in the library directory, its programs, and the terminfo database, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 6.6, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "ncurses"
summary = "ncurses, built for x86 and x86-64, each release a version tag; this one 6.6."
tags = ["ncurses"]

[[dependencies]]
kind = "file"
sha256 = "355b4cbbed880b0381a04c46617b7656e362585d52e9cf84a67e2009b749ff11"
path = "distfiles/ncurses-6.6.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "ncurses-6.6"
root = "ncurses-6.6"
summary = "ncurses 6.6 for x86."
tags = ["ncurses"]
version = "6.6"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:ncurses" }, { provides = "tool:ncurses" }, { provides = "data:terminfo" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "ncurses-6.6"
root = "ncurses-6.6"
summary = "ncurses 6.6 for x86-64."
tags = ["ncurses"]
version = "6.6"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:ncurses" }, { provides = "tool:ncurses" }, { provides = "data:terminfo" }]
