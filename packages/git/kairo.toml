# Git, with HTTP and HTTPS remotes by curl and Perl-compatible grep, without its Perl, Python, and Rust parts, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 2.56.0, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "git"
summary = "Git, built for x86 and x86-64, each release a version tag; this one 2.56.0."
tags = ["git"]

[[dependencies]]
kind = "file"
sha256 = "26c56c296b38c0695b26fa95f475f1d01704d2d38e73465ca30b0b2f5dc789d3"
path = "distfiles/git-2.56.0.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:curl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:expat"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:pcre2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.children]]
name = "git-2.56.0"
root = "git-2.56.0"
summary = "Git 2.56.0 for x86."
tags = ["git"]
version = "2.56.0"
requires = [{ provides = "lib:curl" }, { provides = "lib:expat" }, { provides = "lib:pcre2" }, { provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "lib:zlib" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:git" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:curl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:expat"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:pcre2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.children]]
name = "git-2.56.0"
root = "git-2.56.0"
summary = "Git 2.56.0 for x86-64."
tags = ["git"]
version = "2.56.0"
requires = [{ provides = "lib:curl" }, { provides = "lib:expat" }, { provides = "lib:pcre2" }, { provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "lib:zlib" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:git" }]
