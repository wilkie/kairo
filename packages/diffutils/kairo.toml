# GNU diffutils, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 3.10, its
# first generation, built with data:bootstrap-base (../bootstrap-base/),
# the bootstraps' packages alone. Its libraries, if any, go in the
# environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "diffutils"
summary = "GNU diffutils, built for x86 and x86-64, each release a version tag; this one 3.10."
tags = ["base", "diffutils"]

[[dependencies]]
kind = "file"
sha256 = "90e5e93cc724e4ebe12ede80df1634063c7a855692685919bfe60b556c9bd09e"
path = "distfiles/diffutils-3.10.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:bootstrap-base"

[[build.targets.children]]
name = "diffutils-3.10"
root = "diffutils-3.10"
summary = "GNU diffutils 3.10 for x86."
tags = ["diffutils"]
version = "3.10"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:diffutils" }, { provides = "tool:diff" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:bootstrap-base"

[[build.targets.children]]
name = "diffutils-3.10"
root = "diffutils-3.10"
summary = "GNU diffutils 3.10 for x86-64."
tags = ["diffutils"]
version = "3.10"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:diffutils" }, { provides = "tool:diff" }]
