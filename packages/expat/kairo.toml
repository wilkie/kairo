# Expat, the XML parser, its library, shared, in the library directory, and `xmlwf`, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 2.10.0, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "expat"
summary = "Expat, built for x86 and x86-64, each release a version tag; this one 2.10.0."
tags = ["expat"]

[[dependencies]]
kind = "file"
sha256 = "c624ba2998fc65df1163a49641ff3f9ab73138b11641d92c86bee0fb01b1bc7f"
path = "distfiles/expat-2.10.0.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "expat-2.10.0"
root = "expat-2.10.0"
summary = "Expat 2.10.0 for x86."
tags = ["expat"]
version = "2.10.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:expat" }, { provides = "tool:xmlwf" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "expat-2.10.0"
root = "expat-2.10.0"
summary = "Expat 2.10.0 for x86-64."
tags = ["expat"]
version = "2.10.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:expat" }, { provides = "tool:xmlwf" }]
