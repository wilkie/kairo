# The Linux 4.14 kernel's headers, for userspace, as the target's architecture has them, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 4.14.336, its
# first generation, built with data:bootstrap-base (../bootstrap-base/),
# the bootstraps' packages alone. Its libraries, if any, go in the
# environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "linux-headers"
summary = "The Linux 4.14 kernel's headers, built for x86 and x86-64, each release a version tag; this one 4.14.336."
tags = ["base", "linux-headers"]

[[dependencies]]
kind = "file"
sha256 = "0820fdb7971c6974338081c11fbf2dc869870501e7bdcac4d0ed58ba1f57b61c"
path = "distfiles/linux-4.14.336.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:bootstrap-base"

[[build.targets.children]]
name = "linux-headers-4.14.336"
root = "linux-headers-4.14.336"
summary = "The Linux 4.14 kernel's headers 4.14.336 for x86."
tags = ["linux-headers"]
version = "4.14.336"
provides = [{ provides = "lib:linux:headers" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:bootstrap-base"

[[build.targets.children]]
name = "linux-headers-4.14.336"
root = "linux-headers-4.14.336"
summary = "The Linux 4.14 kernel's headers 4.14.336 for x86-64."
tags = ["linux-headers"]
version = "4.14.336"
provides = [{ provides = "lib:linux:headers" }]
