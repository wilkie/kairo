# What a typical C or C++ package builds with, as build-base has it
# (../build-base/, DECISIONS.md §57), but offered only by the bootstraps:
# the first generation of every package builds with it (§59). Packages
# offer the bootstrap's labels at its versions, and would win the tie;
# built with one another in one round, they would be a cycle. Each label
# here takes only an offer of one of the bootstraps' objects or their
# children, named by their ids in the archive's canonical store:
#
#   zQmbn8aYLLJJkzCj8wcmTCHUhycMNozG3vWNXxnDrQRziAQ  pass 1, live-bootstrap to zlib
#   zQmRcSie6cMMJSCkJv9tJnkuF1HMSpwqzJQNjJiSLJmAFXu  pass 2, the perl chain
#   zQmRJS223L2J8WGQKQZwCjQh5r1NbMiLmNyQf1vc3QtM3eR  pass 3, to gcc 4.7.4
#   zQmULyVeK4Tmvq3sNAh69bdXwUeKXYUbP27cSva9QgJUA4X  pass 4, python, guile, and autogen
#   zQmUUoeihepsPtywUtHvfu2s6PFV6fFw3YQg8AALvcSo35V  pass 5, to gcc 10.5.0
#   zQmNRiLHtCnvdDer5i5GRqPxzwjDoioZW7oxVSeudCKnNBk  pass 6, to gcc 15.2.0
#   zQmPZfbmnu1hg7oj5E26zhYHuVur4PNAdNUi4STxE3CNdqS  the 64-bit bootstrap's stage 3, the x86_64 root
#
# Labels resolve per environment, as build-base's do: live-bootstrap's
# passes serve x86, the 64-bit root x86-64.
[kairo]
schema = 1
kind = "software"
name = "bootstrap-base"
summary = "What a typical C or C++ package builds with, offered only by the bootstraps: for a package's first generation."
tags = ["build-environment", "toolchain", "bootstrap"]

[[provides]]
provides = "data:bootstrap-base"
version = "1.0.0"

