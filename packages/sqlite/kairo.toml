# SQLite, its library, shared, in the library directory, and the `sqlite3` shell, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 3.54.1, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "sqlite"
summary = "SQLite, built for x86 and x86-64, each release a version tag; this one 3.54.1."
tags = ["sqlite"]

[[dependencies]]
kind = "file"
sha256 = "926ef8d3eab93fbf6e06011901273eec076b25594a4e1cdadd50c987f4f6d64e"
path = "distfiles/sqlite-autoconf-3540100.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "sqlite-3.54.1"
root = "sqlite-3.54.1"
summary = "SQLite 3.54.1 for x86."
tags = ["sqlite"]
version = "3.54.1"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:sqlite3" }, { provides = "tool:sqlite3" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "sqlite-3.54.1"
root = "sqlite-3.54.1"
summary = "SQLite 3.54.1 for x86-64."
tags = ["sqlite"]
version = "3.54.1"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:sqlite3" }, { provides = "tool:sqlite3" }]
