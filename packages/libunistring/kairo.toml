# GNU libunistring, Unicode strings, shared, in the library directory, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 1.5, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "libunistring"
summary = "GNU libunistring, built for x86 and x86-64, each release a version tag; this one 1.5."
tags = ["libunistring"]

[[dependencies]]
kind = "file"
sha256 = "fe89007a8a414ae4790b816b86859e877d3ab135db3c37f06541ff7e85ac344b"
path = "distfiles/libunistring-1.5.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "libunistring-1.5"
root = "libunistring-1.5"
summary = "GNU libunistring 1.5 for x86."
tags = ["libunistring"]
version = "1.5"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:unistring" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "libunistring-1.5"
root = "libunistring-1.5"
summary = "GNU libunistring 1.5 for x86-64."
tags = ["libunistring"]
version = "1.5"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:unistring" }]
