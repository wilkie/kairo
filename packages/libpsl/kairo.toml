# libpsl, the public suffix list as a library, shared, in the library directory, the list built in, and `psl`, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 0.23.3, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "libpsl"
summary = "libpsl, built for x86 and x86-64, each release a version tag; this one 0.23.3."
tags = ["libpsl"]

[[dependencies]]
kind = "file"
sha256 = "93941f85a1e7bd593fa94f299233cb5dfc91cd144fd9a78a6ceb75001c5b03be"
path = "distfiles/libpsl-0.23.3.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:idn2"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:python"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:pkgconf"

[[build.targets.children]]
name = "libpsl-0.23.3"
root = "libpsl-0.23.3"
summary = "libpsl 0.23.3 for x86."
tags = ["libpsl"]
version = "0.23.3"
requires = [{ provides = "lib:idn2" }, { provides = "lib:unistring" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "lib:psl" }, { provides = "tool:psl" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:idn2"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:python"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:pkgconf"

[[build.targets.children]]
name = "libpsl-0.23.3"
root = "libpsl-0.23.3"
summary = "libpsl 0.23.3 for x86-64."
tags = ["libpsl"]
version = "0.23.3"
requires = [{ provides = "lib:idn2" }, { provides = "lib:unistring" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "lib:psl" }, { provides = "tool:psl" }]
