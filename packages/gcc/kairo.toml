summary = "gcc 15.2.0's shared libatomic, for x86."
tags = ["gcc"]
version = "15.2.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:atomic:shared", confers = [{ provides = "lib:atomic:shared", version = ">=15.2.0" }] }]

[[build.targets.children]]
name = "libitm-15.2.0"
root = "libitm-15.2.0"
summary = "gcc 15.2.0's shared libitm, for x86."
tags = ["gcc"]
version = "15.2.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:itm:shared", confers = [{ provides = "lib:itm:shared", version = ">=15.2.0" }] }]

[[build.targets.children]]
name = "libquadmath-15.2.0"
root = "libquadmath-15.2.0"
summary = "gcc 15.2.0's shared libquadmath, for x86."
tags = ["gcc"]
