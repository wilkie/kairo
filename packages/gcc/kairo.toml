# gcc, with C and C++, for musl, as a package of its own outside the
# bootstraps (specs/DECISIONS.md §55): one object for every release, each
# a version tag on its history (§59), and a target for each environment
# it is built for. This revision is gcc 15.2.0, built with gcc 7.5.0, its
# first release, an older generation of the same object (§59): the
# releases' recipes are the object's history, each at its tag. The x86 target builds it on
# live-bootstrap's x86 packages, the x86-64 target on the 64-bit
# bootstrap's (bootstrap/amd64/), each from their packages by label.
# Each gcc bootstraps, built by the root's gcc 15 and then by itself, so
# what it is doesn't depend on that gcc. Each target's compiler is a
# child that can sit beside another gcc, and each of its shared runtime
# libraries a child of its own (DECISIONS.md §56).
[kairo]
schema = 1
kind = "software"
name = "gcc"
summary = "gcc with C and C++ for musl, built for x86 and x86-64, each release a version tag; this one 15.2.0."
tags = ["toolchain", "gcc", "compiler"]

# The sources both targets build: gcc, and gmp, mpfr, and mpc, built in
# its tree.

[[dependencies]]
kind = "file"
sha256 = "438fd996826b0c82485a29da03a72d71d6e3541a83ec702df4271f6fe025d24e"
path = "distfiles/gcc-15.2.0.tar.xz"

[[dependencies]]
kind = "file"
sha256 = "fd4829912cddd12f84181c3451cc752be224643e87fac497b69edddadc49b4f2"
path = "distfiles/gmp-6.2.1.tar.xz"

[[dependencies]]
kind = "file"
sha256 = "0c98a3f1732ff6ca4ea690552079da9c597872d30e96ec28414ee23c95558a7f"
path = "distfiles/mpfr-4.1.0.tar.xz"

[[dependencies]]
kind = "file"
sha256 = "17503d2c395dfcf106b622dc142683c1199431d095367c6aacba6eec30340459"
path = "distfiles/mpc-1.2.1.tar.gz"

# Each target builds in its environment with what a typical C or C++
# package does, offered by the bootstraps alone, data:bootstrap-base
# (../bootstrap-base/, DECISIONS.md §57, §59), whose dependencies it
# takes as its own: live-bootstrap's packages on x86, the 64-bit
# bootstrap's on x86-64, static musl among them, for its checks;
# neither target takes a whole root. Its first stage is built by gcc
# 7.5.0, this object's own release at that tag, which replaces
# bootstrap-base's gcc: a build may use an older generation of its own
# object (§59).
#
# Each target's artifact is its children, the compiler and each shared
# runtime library, and the whole is nobody's to install. The compiler
# needs what a gcc needs beside it: binutils for its target, musl's
# headers, a musl to link against, chosen by what builds with it (§51),
# the kernel's headers, and the shared musl and libgcc_s its own
# programs load. The libraries confer themselves as a range, so a
# program runs with the newest any gcc offers (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:bootstrap-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:gcc"
version = "^7"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:g++"
version = "^7"

[[build.targets.children]]
name = "gcc-15.2.0"
root = "gcc-15.2.0"
summary = "gcc 15.2.0 with C and C++ for x86, without its shared runtime libraries, which are children of their own."
tags = ["gcc"]
version = "15.2.0"
requires = [{ provides = "tool:binutils:i686-linux-musl" }, { provides = "lib:musl:headers" }, { one_of = [{ provides = "lib:musl:static" }, { provides = "lib:musl:shared" }] }, { provides = "lib:linux:headers" }, { provides = "lib:musl:shared" }, { provides = "lib:gcc:shared" }]
provides = [{ provides = "tool:gcc" }, { provides = "tool:g++" }, { provides = "lib:stdc++:static" }, { provides = "tool:gcc:i686-linux-musl" }, { provides = "tool:g++:i686-linux-musl" }]

[[build.targets.children]]
name = "libstdc++-15.2.0"
root = "libstdc++-15.2.0"
summary = "gcc 15.2.0's shared libstdc++, for x86."
tags = ["gcc"]
version = "15.2.0"
requires = [{ provides = "lib:gcc:shared" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "lib:stdc++:shared", confers = [{ provides = "lib:stdc++:shared", version = ">=15.2.0" }] }]

[[build.targets.children]]
name = "libgcc_s-15.2.0"
root = "libgcc_s-15.2.0"
summary = "gcc 15.2.0's shared libgcc_s, for x86."
tags = ["gcc"]
version = "15.2.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:gcc:shared", confers = [{ provides = "lib:gcc:shared", version = ">=15.2.0" }] }]

[[build.targets.children]]
name = "libgomp-15.2.0"
root = "libgomp-15.2.0"
summary = "gcc 15.2.0's shared libgomp, for x86."
tags = ["gcc"]
version = "15.2.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:gomp:shared", confers = [{ provides = "lib:gomp:shared", version = ">=15.2.0" }] }]

[[build.targets.children]]
name = "libatomic-15.2.0"
