# Rust, rustc and cargo, as a package of its own (specs/DECISIONS.md §55,
# §59, §65): one object for every release, each a version tag on its
# history, built for x86-64 alone, each by the release before it. This
# revision is 1.91.1 again, released as 1.91.1+2: the double compile
# (§65 sub-decision 3), built by this object's own 1.91.1, which
# mrustc's rustc 1.90.0 built (../mrustc/); its artifacts must be
# 1.91.1's, byte for byte. With data:build-base (../build-base/): with packages
# alone, no bootstrap's object taking part (§61). Its libraries go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "rust"
summary = "Rust, rustc and cargo, built for x86-64 from source, each release a version tag built by the one before; this one 1.91.1."
tags = ["rust", "toolchain", "compiler"]

[[dependencies]]
kind = "file"
sha256 = "66401bb815e236cc6b2aacbbe23b61b286c1fe27a67902e7c0222cfe77b3dbab"
path = "distfiles/rustc-1.91.1-src.tar.xz"

# The target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86-64, built and run in the x86-64 environment; there is no x86
# target (§65 sub-decision 5).
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

# The release before: for the double compile, 1.91.1 itself, an
# older generation of this object (§59).
[[build.targets.dependencies]]
kind = "provides"
provides = "tool:rustc"
version = "=1.91.1"

# LLVM 21, which every release from 1.91 to 1.99 accepts (§65
# sub-decision 4), linked shared.
[[build.targets.dependencies]]
kind = "provides"
provides = "lib:llvm"
version = "^21"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:llvm:shared"
version = "^21"

# x.py, and what cargo links, found by pkg-config.
[[build.targets.dependencies]]
kind = "provides"
provides = "tool:python"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:pkgconf"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:curl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssh2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.children]]
name = "rust-1.91.1"
root = "rust-1.91.1"
summary = "Rust 1.91.1, rustc and cargo, for x86-64."
tags = ["rust"]
version = "1.91.1"
requires = [{ provides = "lib:llvm:shared", version = "~21.1" }, { provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "lib:curl" }, { provides = "lib:ssh2" }, { provides = "lib:zlib" }, { provides = "lib:stdc++:shared" }, { provides = "lib:gcc:shared" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:rustc" }, { provides = "tool:cargo" }, { provides = "tool:rustdoc" }]
