# Python, without pip, with its shared library in the library directory, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 3.11.1
# again, with ssl, hashlib's OpenSSL digests, sqlite3, curses, readline,
# dbm, and uuid, superseding the earlier ones (§61); built with data:build-base (../build-base/): with
# packages alone, no bootstrap's object taking part (§61). Its libraries,
# if any, go in the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "python"
summary = "Python, built for x86 and x86-64, each release a version tag; this one 3.11.1."
tags = ["python"]

[[dependencies]]
kind = "file"
sha256 = "85879192f2cffd56cb16c092905949ebf3e5e394b7f764723529637901dfb58f"
path = "distfiles/Python-3.11.1.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ffi"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:lzma"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:bz2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:sqlite3"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ncurses"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:readline"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:gdbm"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:uuid"

# Not loaded: the build checks that ssl finds the certificate
# authorities where OpenSSL's directory puts them.
[[build.targets.dependencies]]
kind = "provides"
provides = "data:ca-certificates"

[[build.targets.children]]
name = "python-3.11.1"
root = "python-3.11.1"
summary = "Python 3.11.1 for x86."
tags = ["python"]
version = "3.11.1"
requires = [{ provides = "lib:ffi" }, { provides = "lib:zlib" }, { provides = "lib:bz2" }, { provides = "lib:lzma" }, { provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "lib:sqlite3" }, { provides = "lib:ncurses" }, { provides = "lib:readline" }, { provides = "lib:gdbm" }, { provides = "lib:uuid" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:python" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ffi"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:lzma"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:bz2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:sqlite3"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ncurses"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:readline"

[[build.targets.dependencies]]
