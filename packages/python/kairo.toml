requires = [{ provides = "lib:ffi" }, { provides = "lib:zlib" }, { provides = "lib:bz2" }, { provides = "lib:lzma" }, { provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "lib:sqlite3" }, { provides = "lib:ncurses" }, { provides = "lib:readline" }, { provides = "lib:gdbm" }, { provides = "lib:uuid" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:python" }]
