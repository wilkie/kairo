# GNU grep, as a package of its own (specs/DECISIONS.md §55, §59): one
# object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 3.12,
# its second round, released as 3.12+2: built with data:base-round 1
# (../base-round/), the base's first round, each package at its
# snapshot, so the base builds with the round before it, never with
# itself (§64). Its libraries, if any, go in the environment's directory
# for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "grep"
summary = "GNU grep, built for x86 and x86-64, each release a version tag; this one 3.12."
tags = ["base", "grep"]

[[dependencies]]
kind = "file"
sha256 = "2649b27c0e90e632eadcd757be06c6e9a4f48d941de51e7c0f83ff76408a07b9"
path = "distfiles/grep-3.12.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^1"

[[build.targets.children]]
name = "grep-3.12"
root = "grep-3.12"
summary = "GNU grep 3.12 for x86."
tags = ["grep"]
version = "3.12"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:grep" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^1"

[[build.targets.children]]
name = "grep-3.12"
root = "grep-3.12"
summary = "GNU grep 3.12 for x86-64."
tags = ["grep"]
version = "3.12"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:grep" }]
