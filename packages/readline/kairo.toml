# GNU readline, with its six official patches, shared, in the library directory, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 8.3.6, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "readline"
summary = "GNU readline, built for x86 and x86-64, each release a version tag; this one 8.3.6."
tags = ["readline"]

[[dependencies]]
kind = "file"
sha256 = "fe5383204467828cd495ee8d1d3c037a7eba1389c22bc6a041f627976f9061cc"
path = "distfiles/readline-8.3.tar.gz"

[[dependencies]]
kind = "file"
sha256 = "21f0a03106dbe697337cd25c70eb0edbaa2bdb6d595b45f83285cdd35bac84de"
path = "distfiles/readline83-001"

[[dependencies]]
kind = "file"
sha256 = "e27364396ba9f6debf7cbaaf1a669e2b2854241ae07f7eca74ca8a8ba0c97472"
path = "distfiles/readline83-002"

[[dependencies]]
kind = "file"
sha256 = "72dee13601ce38f6746eb15239999a7c56f8e1ff5eb1ec8153a1f213e4acdb29"
path = "distfiles/readline83-003"

[[dependencies]]
