# GNU patch, as a package of its own (specs/DECISIONS.md §55, §59): one
# object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 2.8, its
# fourth round, released as 2.8+4: built with data:base-round 3
# (../base-round/), the base's third round, each package at its
# snapshot, so the base builds with the round before it, never with
# itself (§64). Its libraries, if any, go in the environment's directory
# for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "patch"
summary = "GNU patch, built for x86 and x86-64, each release a version tag; this one 2.8."
tags = ["base", "patch"]

[[dependencies]]
kind = "file"
sha256 = "f87cee69eec2b4fcbf60a396b030ad6aa3415f192aa5f7ee84cad5e11f7f5ae3"
path = "distfiles/patch-2.8.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^3"

[[build.targets.children]]
name = "patch-2.8"
root = "patch-2.8"
summary = "GNU patch 2.8 for x86."
tags = ["patch"]
version = "2.8"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:patch" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^3"

[[build.targets.children]]
name = "patch-2.8"
root = "patch-2.8"
summary = "GNU patch 2.8 for x86-64."
tags = ["patch"]
version = "2.8"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:patch" }]
