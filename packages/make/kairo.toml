# GNU make, as a package of its own (specs/DECISIONS.md §55, §59): one
# object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 4.2.1,
# its second round, released as 4.2.1+2: built with data:base-round 1
# (../base-round/), the base's first round, each package at its
# snapshot, so the base builds with the round before it, never with
# itself (§64). Its libraries, if any, go in the environment's directory
# for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "make"
summary = "GNU make, built for x86 and x86-64, each release a version tag; this one 4.2.1."
tags = ["build", "make"]

[[dependencies]]
kind = "file"
sha256 = "e40b8f018c1da64edd1cc9a6fce5fa63b2e707e404e20cad91fbae337c98a5b7"
path = "distfiles/make-4.2.1.tar.gz"

# Each target's artifact is its children, and the whole is nobody's to
# install. What each child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^1"

[[build.targets.children]]
name = "make-4.2.1"
root = "make-4.2.1"
summary = "GNU make 4.2.1 for x86."
tags = ["make"]
version = "4.2.1"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:make" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^1"

[[build.targets.children]]
name = "make-4.2.1"
root = "make-4.2.1"
summary = "GNU make 4.2.1 for x86-64."
tags = ["make"]
version = "4.2.1"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:make" }]
