# GNU dbm, its libraries, shared, in the library directory, with its ndbm compatibility, and its programs, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 1.26, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "gdbm"
summary = "GNU dbm, built for x86 and x86-64, each release a version tag; this one 1.26."
tags = ["gdbm"]

[[dependencies]]
kind = "file"
sha256 = "6a24504a14de4a744103dcb936be976df6fbe88ccff26065e54c1c47946f4a5e"
path = "distfiles/gdbm-1.26.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "gdbm-1.26"
root = "gdbm-1.26"
summary = "GNU dbm 1.26 for x86."
tags = ["gdbm"]
version = "1.26"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:gdbm" }, { provides = "tool:gdbm" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "gdbm-1.26"
root = "gdbm-1.26"
summary = "GNU dbm 1.26 for x86-64."
tags = ["gdbm"]
version = "1.26"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:gdbm" }, { provides = "tool:gdbm" }]
