# GNU awk, with `/usr/bin/awk` a link to it, as a package of its own
# (specs/DECISIONS.md §55, §59): one object for every release, each a
# version tag on its history, and a target for each environment it is
# built for. This revision is 5.3.0, its fourth round, released as
# 5.3.0+4: built with data:base-round 3 (../base-round/), the base's
# third round, each package at its snapshot, so the base builds with
# the round before it, never with itself (§64). Its libraries, if any,
# go in the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "gawk"
summary = "GNU awk, built for x86 and x86-64, each release a version tag; this one 5.3.0."
tags = ["base", "gawk"]

[[dependencies]]
kind = "file"
sha256 = "ca9c16d3d11d0ff8c69d79dc0b47267e1329a69b39b799895604ed447d3ca90b"
path = "distfiles/gawk-5.3.0.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^3"

[[build.targets.children]]
name = "gawk-5.3.0"
root = "gawk-5.3.0"
summary = "GNU awk 5.3.0 for x86."
tags = ["gawk"]
version = "5.3.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:gawk" }, { provides = "tool:awk" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^3"

[[build.targets.children]]
name = "gawk-5.3.0"
root = "gawk-5.3.0"
summary = "GNU awk 5.3.0 for x86-64."
tags = ["gawk"]
version = "5.3.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:gawk" }, { provides = "tool:awk" }]
