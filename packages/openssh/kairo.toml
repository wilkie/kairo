# OpenSSH, its client, its server, and their tools, with OpenSSL and zlib, configured in `/etc/ssh`, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 10.6p2, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "openssh"
summary = "OpenSSH, built for x86 and x86-64, each release a version tag; this one 10.6p2."
tags = ["openssh"]

[[dependencies]]
kind = "file"
sha256 = "9ae44872090cf2f06b3cf9ff147e7f16f309671340763ed2f99248398ae29d5b"
path = "distfiles/openssh-10.6p2.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.children]]
name = "openssh-10.6p2"
root = "openssh-10.6p2"
summary = "OpenSSH 10.6p2 for x86."
tags = ["openssh"]
version = "10.6.2"
requires = [{ provides = "lib:crypto" }, { provides = "lib:zlib" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:ssh" }, { provides = "tool:sshd" }, { provides = "tool:openssh" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.children]]
name = "openssh-10.6p2"
root = "openssh-10.6p2"
summary = "OpenSSH 10.6p2 for x86-64."
tags = ["openssh"]
version = "10.6.2"
requires = [{ provides = "lib:crypto" }, { provides = "lib:zlib" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "tool:ssh" }, { provides = "tool:sshd" }, { provides = "tool:openssh" }]
