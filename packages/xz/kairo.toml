# XZ Utils, `xz` and liblzma, shared and static, in the library
# directory, as a package of its own (specs/DECISIONS.md §55, §59): one
# object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 5.6.4,
# its third round, released as 5.6.4+3: built with data:base-round 2
# (../base-round/), the base's second round, each package at its
# snapshot, so the base builds with the round before it, never with
# itself (§64). Its libraries, if any, go in the environment's directory
# for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "xz"
summary = "XZ Utils, built for x86 and x86-64, each release a version tag; this one 5.6.4."
tags = ["base", "xz"]

[[dependencies]]
kind = "file"
sha256 = "176d510c30d80a23b8050bbc048f2ecaacb823ae48b6821727ed6591f0df9200"
path = "distfiles/xz-5.6.4.tar.bz2"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^2"

[[build.targets.children]]
name = "xz-5.6.4"
root = "xz-5.6.4"
summary = "XZ Utils 5.6.4 for x86."
tags = ["xz"]
version = "5.6.4"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:xz" }, { provides = "lib:lzma" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^2"

[[build.targets.children]]
name = "xz-5.6.4"
root = "xz-5.6.4"
summary = "XZ Utils 5.6.4 for x86-64."
tags = ["xz"]
version = "5.6.4"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:xz" }, { provides = "lib:lzma" }]
