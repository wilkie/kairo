# GNU coreutils, without kill and uptime, which come with other
# packages, as a package of its own (specs/DECISIONS.md §55, §59): one
# object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 9.4, its
# third round, released as 9.4+3: built with data:base-round 2
# (../base-round/), the base's second round, each package at its
# snapshot, so the base builds with the round before it, never with
# itself (§64). Its libraries, if any, go in the environment's directory
# for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "coreutils"
summary = "GNU coreutils, built for x86 and x86-64, each release a version tag; this one 9.4."
tags = ["base", "coreutils"]

[[dependencies]]
kind = "file"
sha256 = "ea613a4cf44612326e917201bbbcdfbd301de21ffc3b59b6e5c07e040b275e52"
path = "distfiles/coreutils-9.4.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^2"

[[build.targets.children]]
name = "coreutils-9.4"
root = "coreutils-9.4"
summary = "GNU coreutils 9.4 for x86."
tags = ["coreutils"]
version = "9.4"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:coreutils" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^2"

[[build.targets.children]]
name = "coreutils-9.4"
root = "coreutils-9.4"
summary = "GNU coreutils 9.4 for x86-64."
tags = ["coreutils"]
version = "9.4"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:coreutils" }]
