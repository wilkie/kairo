# Meson, the build system, as one file Python runs, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 1.12.1, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "meson"
summary = "Meson, built for x86 and x86-64, each release a version tag; this one 1.12.1."
tags = ["meson"]

[[dependencies]]
kind = "file"
sha256 = "ab0a6ca09f8ef70c564c8241fb5a23957886a0b53fb58412b5e07eaf07dba743"
path = "distfiles/meson-1.12.1.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:python"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:ninja"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:pkgconf"

[[build.targets.children]]
name = "meson-1.12.1"
root = "meson-1.12.1"
summary = "Meson 1.12.1 for x86."
tags = ["meson"]
version = "1.12.1"
requires = [{ provides = "tool:python" }, { provides = "tool:ninja" }]
provides = [{ provides = "tool:meson" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:python"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:ninja"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:pkgconf"

[[build.targets.children]]
name = "meson-1.12.1"
root = "meson-1.12.1"
summary = "Meson 1.12.1 for x86-64."
tags = ["meson"]
version = "1.12.1"
requires = [{ provides = "tool:python" }, { provides = "tool:ninja" }]
provides = [{ provides = "tool:meson" }]
