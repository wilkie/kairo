# libssh2, SSH2 in C, shared, in the library directory, with OpenSSL and zlib, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 1.11.1, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "libssh2"
summary = "libssh2, built for x86 and x86-64, each release a version tag; this one 1.11.1."
tags = ["libssh2"]

[[dependencies]]
kind = "file"
sha256 = "9954cb54c4f548198a7cbebad248bdc87dd64bd26185708a294b2b50771e3769"
path = "distfiles/libssh2-1.11.1.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.children]]
name = "libssh2-1.11.1"
root = "libssh2-1.11.1"
summary = "libssh2 1.11.1 for x86."
tags = ["libssh2"]
version = "1.11.1"
requires = [{ provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "lib:zlib" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "lib:ssh2" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.children]]
name = "libssh2-1.11.1"
root = "libssh2-1.11.1"
summary = "libssh2 1.11.1 for x86-64."
tags = ["libssh2"]
version = "1.11.1"
requires = [{ provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "lib:zlib" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "lib:ssh2" }]
