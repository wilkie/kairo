# curl and libcurl, shared, in the library directory, with OpenSSL, nghttp2, libpsl, libidn2, libssh2, zlib, zstd, and brotli, trusting the ca-certificates bundle, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 8.23.0
# again, with every library it uses a package, SCP and SFTP too,
# superseding the earlier ones (§61); built with data:build-base (../build-base/): with packages
# alone, no bootstrap's object taking part (§61). Its libraries go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "curl"
summary = "curl and libcurl, built for x86 and x86-64, each release a version tag; this one 8.23.0."
tags = ["curl"]

[[dependencies]]
kind = "file"
sha256 = "8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5"
path = "distfiles/curl-8.23.0.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zstd"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:brotli"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:nghttp2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:psl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:idn2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssh2"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:pkgconf"

[[build.targets.children]]
name = "curl-8.23.0"
root = "curl-8.23.0"
summary = "curl and libcurl 8.23.0 for x86."
tags = ["curl"]
version = "8.23.0"
requires = [{ provides = "lib:ssl" }, { provides = "lib:crypto" }, { provides = "lib:zlib" }, { provides = "lib:zstd" }, { provides = "lib:brotli" }, { provides = "lib:nghttp2" }, { provides = "lib:psl" }, { provides = "lib:idn2" }, { provides = "lib:ssh2" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "lib:curl" }, { provides = "tool:curl" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zlib"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:zstd"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:brotli"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:nghttp2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:psl"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:idn2"

[[build.targets.dependencies]]
kind = "provides"
provides = "lib:ssh2"

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:pkgconf"

[[build.targets.children]]
name = "curl-8.23.0"
root = "curl-8.23.0"
