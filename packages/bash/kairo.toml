# GNU bash, the shell, with `/usr/bin/sh` a link to it, as a package of
# its own (specs/DECISIONS.md §55, §59): one object for every release,
# each a version tag on its history, and a target for each environment
# it is built for. This revision is 5.2.15, its third round, released as
# 5.2.15+3: built with data:base-round 2 (../base-round/), the base's
# second round, each package at its snapshot, so the base builds with
# the round before it, never with itself (§64). Its libraries, if any,
# go in the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "bash"
summary = "GNU bash, built for x86 and x86-64, each release a version tag; this one 5.2.15."
tags = ["base", "bash"]

[[dependencies]]
kind = "file"
sha256 = "13720965b5f4fc3a0d4b61dd37e7565c741da9a5be24edc2ae00182fc1b3588c"
path = "distfiles/bash-5.2.15.tar.gz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^2"

[[build.targets.children]]
name = "bash-5.2.15"
root = "bash-5.2.15"
summary = "GNU bash 5.2.15 for x86."
tags = ["bash"]
version = "5.2.15"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:bash" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:base-round"
version = "^2"

[[build.targets.children]]
name = "bash-5.2.15"
root = "bash-5.2.15"
summary = "GNU bash 5.2.15 for x86-64."
tags = ["bash"]
version = "5.2.15"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:bash" }]
