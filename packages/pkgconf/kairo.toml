# pkgconf, which answers as `pkg-config` too, and its library, shared, in the library directory, as a package of its own (specs/DECISIONS.md §55, §59):
# one object for every release, each a version tag on its history, and a
# target for each environment it is built for. This revision is 3.0.10, its
# first, built with data:build-base (../build-base/): with packages alone,
# no bootstrap's object taking part (§61). Its libraries, if any, go in
# the environment's directory for musl's (§60).
[kairo]
schema = 1
kind = "software"
name = "pkgconf"
summary = "pkgconf, built for x86 and x86-64, each release a version tag; this one 3.0.10."
tags = ["pkgconf"]

[[dependencies]]
kind = "file"
sha256 = "9371b2f6372da574d4c6dc96fe9b1463037bcf6afcb6671c1555afde7b17e2de"
path = "distfiles/pkgconf-3.0.10.tar.xz"

# Each target's artifact is its child, and the whole is nobody's to
# install. What the child requires is what its programs and libraries
# load, as build.sh reports it (§56).

# For x86, built and run in the x86 environment.
[[build.targets]]
name = "x86"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "i686-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "pkgconf-3.0.10"
root = "pkgconf-3.0.10"
summary = "pkgconf 3.0.10 for x86."
tags = ["pkgconf"]
version = "3.0.10"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:pkgconf" }, { provides = "tool:pkg-config" }, { provides = "lib:pkgconf" }]

# For x86-64, built and run in the x86-64 environment.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "x86_64-pc-linux-musl"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "provides"
provides = "data:build-base"

[[build.targets.children]]
name = "pkgconf-3.0.10"
root = "pkgconf-3.0.10"
summary = "pkgconf 3.0.10 for x86-64."
tags = ["pkgconf"]
version = "3.0.10"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:pkgconf" }, { provides = "tool:pkg-config" }, { provides = "lib:pkgconf" }]
