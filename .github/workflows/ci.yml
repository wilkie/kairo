# Slice 10 CI workflow.
#
# Four independent jobs run in parallel:
#
#   - rust       — `cargo fmt --check`, `cargo clippy -D
#                  warnings`, `cargo test --workspace` across
#                  every crate. Catches the daemon /
#                  store / web / cli regressions the inspector
#                  ultimately sits on top of.
#   - frontend   — `pnpm format:check` (Prettier), then
#                  `typecheck`, `lint`, `test`, `build` across
#                  the workspace via Turbo.
#                  `generate:api` is wired as a Turbo dep so
#                  the schema regenerates first automatically.
#   - e2e-real   — two-node federation smoke
#                  (`scripts/federation-smoke.sh`, SHA-1 and
#                  SHA-256 Git histories), then the Playwright
#                  suite against the built SPA served by a real
#                  `kairo-web` + `kairo-daemon` over a store
#                  seeded by `scripts/smoke-seed.sh` plus one
#                  federated pull (`playwright.real.config.ts`).
#                  Catches what the MSW mocks can't: proxy
#                  guards, real signing and capability checks,
#                  persistence, and node-to-node pull.
#   - e2e        — Playwright suite against the SPA in dev
#                  mode with the MSW mock registry. The dev
#                  server is started by Playwright's webServer
#                  config; the env var `CI=true` (set by
#                  GitHub Actions) makes Playwright spin up a
#                  fresh one rather than reusing a local
#                  process.
#
# pnpm 10's `onlyBuiltDependencies` policy blocks Playwright's
# post-install browser fetch; the `e2e:install` script runs
# `playwright install --with-deps chromium` explicitly to get
# the binary on the runner.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch — saves runner
# minutes on a force-push or rapid-fire PR pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt + clippy + test --workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-toolchain.toml`.
      - name: Install rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test --workspace
        run: cargo test --workspace --locked

  frontend:
    name: Frontend pipeline (format/typecheck/lint/test/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: prettier --check
        run: pnpm format:check
      - name: turbo pipeline
        run: pnpm turbo typecheck lint test build

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm -F @kairo/web-client e2e:install
      - name: Playwright tests
        run: pnpm -F @kairo/web-client e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/apps/web-client/playwright-report/
          retention-days: 7

  e2e-real:
    name: Frontend e2e against the real stack (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Keep in step with `rust-toolchain.toml`.
      - name: Install rust toolchain (1.99.1)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
      - name: cargo build --bins
        working-directory: .
        run: cargo build --bins --locked
      - name: Federation smoke (SHA-1 and SHA-256)
        working-directory: .
        run: |
          scripts/federation-smoke.sh
          OBJECT_FORMAT=sha256 scripts/federation-smoke.sh
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Build SPA (no mocks)
        run: pnpm turbo run build --filter @kairo/web-client...
      - name: Install Playwright browsers
        run: pnpm -F @kairo/web-client e2e:install
      - name: Playwright tests (real stack)
        run: pnpm -F @kairo/web-client e2e:real
      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-real-results
          path: frontend/apps/web-client/test-results/
          retention-days: 7
