# The 64-bit bootstrap's second stage (bootstrap/amd64/README.md): a
# minimal x86_64 root, cross-built under x86 with stage 1's toolchain
# (bootstrap/amd64/cross/). It holds what stage 3 needs to build itself
# natively: musl, the Linux headers, binutils, gcc with C and C++, and a
# GNU userland. Its programs run in x86-64; it is built in x86
# (DECISIONS.md §53).
[kairo]
schema = 1
kind = "software"
name = "amd64-cross-root"
summary = "A minimal x86_64 root cross-built under x86: musl 1.2.5, binutils 2.41, gcc 15.2.0 with C and C++, and a GNU userland."
tags = ["bootstrap", "amd64", "root"]

# What its programs run in.
[[dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh"]
# Its programs find musl's loader at /lib/ld-musl-x86_64.so.1, and its
# scripts /bin/sh, through the merged-/usr links (§46, §50).
requires = [{ provides = "data:linux-filesystem:merged-usr" }]

# Where it is built: in x86, by programs that run there (§53).
[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

# /bin/sh and the rest, which configure scripts expect (§50).
[[build.targets.dependencies]]
kind = "provides"
provides = "data:linux-filesystem:merged-usr"

# live-bootstrap's finished x86 root, at /: the native compilers and
# tools the build runs.
[[build.targets.dependencies]]
kind = "provides"
provides = "data:live-bootstrap:x86:libarchive-3.5.2"
# Named by its object's id in the canonical store: a bootstrap stage
# is no release, offered by label to anyone (DECISIONS.md §61).
offered_by = ["zQmNRiLHtCnvdDer5i5GRqPxzwjDoioZW7oxVSeudCKnNBk"]

# Stage 1, at /: the compilers for x86_64 everything here is built with.
[[build.targets.dependencies]]
kind = "provides"
provides = "tool:gcc:x86_64-linux-musl"
version = "15.2.0"
# Named by its object's id in the canonical store: a bootstrap stage
# is no release, offered by label to anyone (DECISIONS.md §61).
offered_by = ["zQmd8Q4jFCejD6nrNzzKoxZRvE4h7foe7P8xcRfbn13xw4J"]

[[build.targets.dependencies]]
kind = "provides"
provides = "tool:g++:x86_64-linux-musl"
version = "15.2.0"
# Named by its object's id in the canonical store: a bootstrap stage
# is no release, offered by label to anyone (DECISIONS.md §61).
offered_by = ["zQmd8Q4jFCejD6nrNzzKoxZRvE4h7foe7P8xcRfbn13xw4J"]

