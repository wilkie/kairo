# Stage 4: the same build, on stage 3's children, each by its first
# label at its version, offered by this object alone, by its id in the
# archive's canonical store (DECISIONS.md §59), as a package of the same
# version would otherwise win the tie; build.sh --fixed-point checks
# that it makes them again.
[[build.targets]]
name = "fixed-point"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "--fixed-point"]

[build.targets.artifact]
install = false

