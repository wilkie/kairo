# Stage 3: built by stage 2's root, the build's first package after
# binutils a gcc that bootstraps itself, and the rest built by that
# gcc.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh"]
# Its programs find musl's loader at /lib/ld-musl-x86_64.so.1, and its
# scripts /bin/sh, through the merged-/usr links (§46, §50).
requires = [{ provides = "data:linux-filesystem:merged-usr" }]

[[build.targets.dependencies]]
kind = "provides"
provides = "data:amd64-bootstrap:x86-64:cross-root"

# Stage 4: the same build, by stage 3's root; build.sh --fixed-point
# checks that it makes that root again.
[[build.targets]]
name = "fixed-point"
tree = "src"
command = ["/usr/bin/bash", "build.sh", "--fixed-point"]
requires = [{ provides = "data:linux-filesystem:merged-usr" }]

[[build.targets.dependencies]]
kind = "provides"
provides = "data:amd64-bootstrap:x86-64:root"

# The whole root, installed at /.
[[provides]]
provides = "data:amd64-bootstrap:x86-64:root"
target = "x86-64"
