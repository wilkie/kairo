# The 64-bit bootstrap's third and fourth stages
# (bootstrap/amd64/README.md): an x86_64 root built natively, in x86-64,
# by the one before it, each of its packages a child object
# (DECISIONS.md §56). The x86-64 target builds it on stage 2's
# cross-built root (bootstrap/amd64/cross-root/); the fixed-point target
# builds it again on the x86-64 target's children, and fails unless what
# it makes is those children, file for file. It holds musl, the Linux
# headers, binutils, gcc with C and C++ and its runtime libraries, a GNU
# userland, zlib, libffi, perl, and python.
[kairo]
schema = 1
kind = "software"
name = "amd64-root"
summary = "A minimal x86_64 root built natively: musl 1.2.5, binutils 2.41, gcc 15.2.0 with C and C++, a GNU userland, perl 5.42.0, and Python 3.11.1."
tags = ["bootstrap", "amd64", "root"]

[[dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

