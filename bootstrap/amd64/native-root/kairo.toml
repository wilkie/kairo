# Stage 3: built by stage 2's root, the build's first package after
# binutils a gcc that bootstraps itself, and the rest built by that
# gcc. Its artifact is each package in a directory of its own, each a
# child below; the whole is nobody's to install.
[[build.targets]]
name = "x86-64"
tree = "src"
command = ["/usr/bin/bash", "build.sh"]

[build.targets.artifact]
install = false

[[build.targets.dependencies]]
kind = "provides"
provides = "data:amd64-bootstrap:x86-64:cross-root"
# Named by its object's id in the canonical store: a bootstrap stage
# is no release, offered by label to anyone (DECISIONS.md §61).
offered_by = ["zQmV8cKVLvtVPKUwNf6JxSDNvQj8MyYGqxDiDyrQnQy1LAF"]

# Each package, installed at /. Its programs find musl's loader at
# /lib/ld-musl-x86_64.so.1, and its scripts /bin/sh, through the
# merged-/usr links, which musl's shared part requires (§46, §50). What
# each requires is what its programs and libraries load, as build.sh
# reports it. gcc's shared runtime libraries confer themselves as a
# range, so a program runs with the newest any gcc offers (§56).

[[build.targets.children]]
name = "linux-headers-4.14.336"
root = "linux-headers-4.14.336"
summary = "The Linux 4.14 kernel's headers, for x86_64."
tags = ["amd64-bootstrap"]
version = "4.14.336"
provides = [{ provides = "lib:linux:headers" }]

[[build.targets.children]]
name = "binutils-2.41"
root = "binutils-2.41"
summary = "binutils 2.41 for x86_64."
tags = ["amd64-bootstrap"]
version = "2.41"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:binutils" }, { provides = "tool:binutils:x86_64-linux-musl" }]

[[build.targets.children]]
name = "gcc-15.2.0"
root = "gcc-15.2.0"
summary = "gcc 15.2.0 with C and C++ for x86_64, without its shared runtime libraries, which are children of their own."
tags = ["amd64-bootstrap"]
version = "15.2.0"
requires = [{ provides = "tool:binutils:x86_64-linux-musl" }, { provides = "lib:musl:headers" }, { one_of = [{ provides = "lib:musl:static" }, { provides = "lib:musl:shared" }] }, { provides = "lib:linux:headers" }, { provides = "lib:musl:shared" }, { provides = "lib:gcc:shared" }]
provides = [{ provides = "tool:gcc" }, { provides = "tool:g++" }, { provides = "lib:stdc++:static" }, { provides = "tool:gcc:x86_64-linux-musl" }, { provides = "tool:g++:x86_64-linux-musl" }]

[[build.targets.children]]
name = "libstdc++-15.2.0"
root = "libstdc++-15.2.0"
summary = "gcc 15.2.0's shared libstdc++, for x86_64."
tags = ["amd64-bootstrap"]
version = "15.2.0"
requires = [{ provides = "lib:gcc:shared" }, { provides = "lib:musl:shared" }]
provides = [{ provides = "lib:stdc++:shared", confers = [{ provides = "lib:stdc++:shared", version = ">=15.2.0" }] }]

