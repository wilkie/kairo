path = "/external/distfiles/gawk-5.3.0.tar.xz"

[[dependencies]]
kind = "file"
sha256 = "438fd996826b0c82485a29da03a72d71d6e3541a83ec702df4271f6fe025d24e"
path = "/external/distfiles/gcc-15.2.0.tar.xz"

