[[build.targets]]
name = "x86"
# Each step ends in upstream's own check of what it built.
command = ["/usr/bin/bash", "/kairo/src/start.sh", "build binutils-2.41 pass2.sh"]
# start.sh (../live-bootstrap/pass/) puts pass 5's root back as its
# steps left it and runs the generated script from the step after pass
# 5's last, named above; package.sh ships /usr, /etc, every package so
# far, and the state into /kairo/package, and extracts each package this
# pass made into /kairo/package/<package>/, a child object of its own.
#
# The children below are generated: ../live-bootstrap/children.py, from
# the packages this pass makes.


[[build.targets.children]]
name = "gcc-15.2.0_0"
root = "gcc-15.2.0_0"
summary = "gcc 15.2.0, as live-bootstrap builds it (package gcc-15.2.0_0)."
tags = ["live-bootstrap"]
version = "15.2.0"
requires = [{ provides = "tool:binutils:i686-linux-musl" }, { provides = "lib:musl:headers" }, { one_of = [{ provides = "lib:musl:static" }, { provides = "lib:musl:shared" }] }, { provides = "lib:linux:headers" }]
provides = [{ provides = "tool:gcc" }, { provides = "tool:g++" }, { provides = "lib:stdc++:static" }, { provides = "lib:stdc++:shared", confers = [{ provides = "lib:stdc++:shared", version = ">=15.2.0" }] }, { provides = "lib:gcc:shared", confers = [{ provides = "lib:gcc:shared", version = ">=15.2.0" }] }, { provides = "tool:gcc:i686-linux-musl" }, { provides = "tool:g++:i686-linux-musl" }]

[[build.targets.children]]
name = "libmd-1.1.0_0"
root = "libmd-1.1.0_0"
summary = "libmd 1.1.0, as live-bootstrap builds it (package libmd-1.1.0_0)."
tags = ["live-bootstrap"]
version = "1.1.0"
provides = [{ provides = "lib:md" }]

[[build.targets.children]]
