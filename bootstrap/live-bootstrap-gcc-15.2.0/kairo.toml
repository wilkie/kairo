# live-bootstrap for x86, pass 6 (specs/DECISIONS.md §49), the last: goes
# on from pass 5's whole root (bootstrap/live-bootstrap-gcc-10.5.0/, to gcc
# 10.5.0) through gcc 15.2.0, bootstrapped in three stages with C and
# C++, then libmd, libbsd, shadow, opendoas, gzip 1.13, diffutils 3.10,
# gawk 5.3.0, m4 1.4.19, and libarchive 3.5.2, to the end of upstream's
# CI pass 2. It runs upstream's own scripts, generated by upstream's
# script generator from upstream's whole manifest, from the step after
# pass 5's last. Every package it makes is checked against
# live-bootstrap's SHA256SUMS.pkgs.

[kairo]
schema = 1
kind = "software"
name = "live-bootstrap-x86-gcc-15.2.0"
summary = "live-bootstrap b1ceced7 for x86, pass 6: gcc 15.2.0 with C++, and the rest of upstream's CI pass 2."
tags = ["bootstrap", "live-bootstrap"]

# As in pass 1: the guest is root, and / is live-bootstrap's.
[[dependencies]]
kind = "provides"
provides = "environment:linux/x86"

# Pass 5's whole root, installed at /: /usr and /etc, every package so
# far in /repo, and in /state what its steps left outside them.
[[dependencies]]
kind = "provides"
provides = "data:live-bootstrap:x86:binutils-2.41_1"

# live-bootstrap's steps, at the commit the earlier passes ran; this
# pass's manifest, upstream's whole, goes over upstream's.
[[dependencies]]
kind = "source"
source = "https://github.com/fosslinux/live-bootstrap"
revision = "git:sha1:b1ceced7ea8a819a26f23796f6dd7ae8496a33a4"
path = "/steps"
from = "steps"

# The distfiles this pass's steps check and unpack.

[[dependencies]]
kind = "file"
sha256 = "f0b19ff39c3c9a5898a219497ababbadab99d8178acc980155c7e1271089b5a0"
path = "/external/distfiles/libarchive-3.5.2.tar.xz"

[[dependencies]]
