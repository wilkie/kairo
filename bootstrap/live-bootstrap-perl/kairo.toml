# live-bootstrap for x86, pass 2 (specs/DECISIONS.md §49): goes on from
# pass 1's whole root (bootstrap/live-bootstrap/, to zlib in upstream's
# CI pass 2) through upstream's perl chain: dist, perl 5.8.9 to 5.42.0
# with Devel::Tokenizer::C rebuilt for each, automake 1.16.3, autoconf
# 2.71, and bison 3.6.4 to 3.8.2, then the uninstall of perl 5.6.2 and
# 5.8.9. It runs upstream's own scripts, generated by upstream's script
# generator from upstream's manifest truncated after the perl chain, from
# the step after pass 1's last. Every package it makes is checked against
# live-bootstrap's SHA256SUMS.pkgs, as in pass 1.

[kairo]
schema = 1
kind = "software"
name = "live-bootstrap-x86-perl"
summary = "live-bootstrap b1ceced7 for x86, pass 2: its perl chain, perl 5.8.9 to 5.42.0, with automake 1.16.3, autoconf 2.71, and bison 3.8.2."
tags = ["bootstrap", "live-bootstrap"]

# As in pass 1: the guest is root, and / is live-bootstrap's.
[[dependencies]]
kind = "provides"
provides = "environment:linux/x86"

# Pass 1's whole root, installed at /: /usr, its packages in /repo, and
# in /state what its steps left outside them.
[[dependencies]]
kind = "provides"
provides = "data:live-bootstrap:x86:zlib-1.3.1"

# live-bootstrap's steps, at the commit pass 1 ran; this pass's
# truncated manifest goes over upstream's.
[[dependencies]]
kind = "source"
source = "https://github.com/fosslinux/live-bootstrap"
revision = "git:sha1:b1ceced7ea8a819a26f23796f6dd7ae8496a33a4"
path = "/steps"
from = "steps"

