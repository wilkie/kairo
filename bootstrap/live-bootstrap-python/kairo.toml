# live-bootstrap for x86, pass 4 (specs/DECISIONS.md §49): goes on from
# pass 3's whole root (bootstrap/live-bootstrap-gcc-4.7.4/, to gcc 4.7.4)
# through upstream's python chain, python 2.0.1 to 3.11.1 with gperf,
# gettext, texinfo, and libffi along the way and the older pythons
# uninstalled after, then libunistring, the Boehm GC, guile 3.0.11,
# which, grep 3.12, sed 4.8, and autogen 5.18.16. It runs upstream's own
# scripts, generated by upstream's script generator from upstream's
# manifest truncated after autogen, from the step after pass 3's last.
# Every package it makes is checked against live-bootstrap's
# SHA256SUMS.pkgs.

[kairo]
schema = 1
kind = "software"
name = "live-bootstrap-x86-python"
summary = "live-bootstrap b1ceced7 for x86, pass 4: python 2.0.1 to 3.11.1, guile 3.0.11, and autogen 5.18.16."
tags = ["bootstrap", "live-bootstrap"]

# As in pass 1: the guest is root, and / is live-bootstrap's.
[[dependencies]]
kind = "provides"
provides = "environment:linux/x86"

# Pass 3's whole root, installed at /: /usr and /etc, every package so
# far in /repo, and in /state what its steps left outside them.
[[dependencies]]
kind = "provides"
provides = "data:live-bootstrap:x86:musl-1.2.5_2"

# live-bootstrap's steps, at the commit the earlier passes ran; this
# pass's truncated manifest goes over upstream's.
[[dependencies]]
kind = "source"
source = "https://github.com/fosslinux/live-bootstrap"
revision = "git:sha1:b1ceced7ea8a819a26f23796f6dd7ae8496a33a4"
path = "/steps"
from = "steps"

