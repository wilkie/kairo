# The seed object (specs/DECISIONS.md §36 sub-decision 1): the
# bootstrap-seeds repository unchanged. Its AMD64 roots are
# POSIX/AMD64/hex0-seed (229 bytes) and POSIX/AMD64/kaem-optional-seed
# (618 bytes); their hex sources sit beside them for audit. A node
# accepts it as a root of trust by listing it under [[runtime.seeds]].

[kairo]
schema = 1
kind = "software"
name = "bootstrap-seeds"
summary = "stage0-posix seeds: hand-auditable machine code at the root of the toolchain."

[[provides]]
provides = "seed:stage0-posix/amd64"
