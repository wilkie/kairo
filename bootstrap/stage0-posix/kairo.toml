# The stage0-posix bootstrap for AMD64 and x86 (specs/DECISIONS.md §36,
# §37, §38 sub-decision 7): a native object that builds stage0-posix
# Release_1.9.1 from its seeds under the bubblewrap engine. It holds
# nothing upstream wrote; every upstream repository is a source object,
# pinned here by its exact
# Release_1.9.1 commit and placed at its upstream path, so the archive
# proves which upstream commits the build used. The repositories every
# chain uses are pinned here; each target adds its architecture's
# repository and environment. The other architectures' submodules are
# archived by `kairo source fetch` but not built.

[kairo]
schema = 1
kind = "software"
name = "stage0-posix-bootstrap"
summary = "stage0-posix 1.9.1 for AMD64 and x86: hex0 to M2-Planet and mescc-tools from seeds of under a kilobyte."

# stage0-posix
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/stage0-posix"
revision = "git:sha1:45d90f5955b6907dc6cdea9ebafce558359edcd3"
path = "stage0"

# bootstrap-seeds
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/bootstrap-seeds"
revision = "git:sha1:cedec6b8066d1db229b6c77d42d120a23c6980ed"
path = "stage0/bootstrap-seeds"
seed = true   # per architecture, hex0-seed and kaem-optional-seed

# M2libc
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/M2libc"
revision = "git:sha1:68a23cfd05d5a355ba7a30c770d684cbe86fcc4e"
path = "stage0/M2libc"

# M2-Planet
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/M2-Planet"
revision = "git:sha1:bd2fe4b0659fd0ad3f476a5ad0ef801bd134665d"
path = "stage0/M2-Planet"

# M2-Planet's M2libc
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/M2libc"
revision = "git:sha1:68a23cfd05d5a355ba7a30c770d684cbe86fcc4e"
path = "stage0/M2-Planet/M2libc"

# M2-Mesoplanet
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/M2-Mesoplanet"
revision = "git:sha1:4b011a85da73a7c97212468d41f17e806ba99547"
path = "stage0/M2-Mesoplanet"

# M2-Mesoplanet's M2libc
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/M2libc"
revision = "git:sha1:68a23cfd05d5a355ba7a30c770d684cbe86fcc4e"
path = "stage0/M2-Mesoplanet/M2libc"

# mescc-tools
[[dependencies]]
kind = "source"
source = "https://git.savannah.nongnu.org/git/mescc-tools"
revision = "git:sha1:5adfbf3364261a77109878a56b100aeeb6ef9ac4"
path = "stage0/mescc-tools"

# mescc-tools's M2libc
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/M2libc"
revision = "git:sha1:5a7c12a7be39cbce113c5459d77467b829a1ecc5"
path = "stage0/mescc-tools/M2libc"

# mescc-tools-extra
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/mescc-tools-extra"
revision = "git:sha1:a151c245e512076971a3c85bb1502cf92cfa83b6"
path = "stage0/mescc-tools-extra"

# mescc-tools-extra's M2libc
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/M2libc"
revision = "git:sha1:5a7c12a7be39cbce113c5459d77467b829a1ecc5"
path = "stage0/mescc-tools-extra/M2libc"

[[build.targets]]
name = "amd64"
# Phases 0-23 from the seeds alone, ending in upstream's own
# `sha256sum -c amd64.answers`.
command = ["./bootstrap-seeds/POSIX/AMD64/kaem-optional-seed", "../kairo-amd64.kaem"]
workdir = "stage0"

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[build.targets.dependencies]]
kind = "source"
source = "https://github.com/oriansj/stage0-posix-amd64"
revision = "git:sha1:82efa0d6be1c9bb993a7a62af1cccd8d2cda91f6"
path = "stage0/AMD64"

# Tools invoked by path, not installed into a consumer's / (§41).
[build.targets.artifact]
install = false

[[build.targets.outputs]]
name = "bin"
path = "AMD64/bin"
artifact_path = "bin"
kind = "directory"

[[build.targets]]
name = "x86"
# Phases 0-23 from the seeds alone, ending in upstream's own
# `sha256sum -c x86.answers`.
# i386 code, so it needs a host whose kernel runs it (§38).
command = ["./bootstrap-seeds/POSIX/x86/kaem-optional-seed", "../kairo-x86.kaem"]
workdir = "stage0"

[[build.targets.dependencies]]
kind = "provides"
provides = "environment:linux/x86"

[[build.targets.dependencies]]
kind = "source"
source = "https://github.com/oriansj/stage0-posix-x86"
revision = "git:sha1:3b9c2bb6d4155e4f2e5f642b5e0f59255dfc5934"
path = "stage0/x86"

# Tools invoked by path, not installed into a consumer's / (§41).
[build.targets.artifact]
install = false

[[build.targets.outputs]]
name = "bin"
path = "x86/bin"
artifact_path = "bin"
kind = "directory"

# What each target's bin output provides; the resolver picks the one
# built for the consumer's architecture (§38 sub-decision 8).

[[provides]]
provides = "tool:kaem"
version = "1.9.1"
target = "amd64"
output = "bin"

