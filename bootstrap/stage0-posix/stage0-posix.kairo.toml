# The sources object (specs/DECISIONS.md §36 sub-decision 2):
# stage0-posix Release_1.9.1 with its submodules flattened in, and
# bootstrap-seeds/ replaced by a link to the seed's canonical path in
# the environment:linux/x86-64 contract. One target runs phases 0-23
# from the seeds alone, ending in upstream's own
# `sha256sum -c amd64.answers`.

[kairo]
schema = 1
kind = "software"
name = "stage0-posix"
summary = "stage0-posix 1.9.1 for AMD64: hex0 to M2-Planet and mescc-tools from the seeds."

[[dependencies]]
kind = "provides"
provides = "environment:linux/x86-64"

[[dependencies]]
kind = "provides"
provides = "seed:stage0-posix/amd64"

[[build.targets]]
name = "amd64"
command = ["./bootstrap-seeds/POSIX/AMD64/kaem-optional-seed", "./kairo.kaem"]

[[build.targets.outputs]]
name = "bin"
path = "AMD64/bin"
artifact_path = "bin"
kind = "directory"

[[provides]]
provides = "tool:kaem"
version = "1.9.1"
target = "amd64"
output = "bin"

[[provides]]
provides = "tool:hex2"
version = "1.9.1"
target = "amd64"
output = "bin"

