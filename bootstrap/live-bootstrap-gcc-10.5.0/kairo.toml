# live-bootstrap for x86, pass 5 (specs/DECISIONS.md §49): goes on from
# pass 4's whole root (bootstrap/live-bootstrap-python/, through the
# python chain, guile, and autogen) to gcc 10.5.0, with C and C++, and
# binutils 2.41 rebuilt with it. It runs upstream's own scripts,
# generated by upstream's script generator from upstream's manifest
# truncated after that binutils, from the step after pass 4's last.
# Every package it makes is checked against live-bootstrap's
# SHA256SUMS.pkgs.

[kairo]
schema = 1
kind = "software"
name = "live-bootstrap-x86-gcc-10.5.0"
summary = "live-bootstrap b1ceced7 for x86, pass 5: gcc 10.5.0 with C++, and binutils 2.41 rebuilt."
tags = ["bootstrap", "live-bootstrap"]

# As in pass 1: the guest is root, and / is live-bootstrap's.
[[dependencies]]
kind = "provides"
provides = "environment:linux/x86"

# Pass 4's whole root, installed at /: /usr and /etc, every package so
# far in /repo, and in /state what its steps left outside them.
[[dependencies]]
kind = "provides"
provides = "data:live-bootstrap:x86:autogen-5.18.16"

# live-bootstrap's steps, at the commit the earlier passes ran; this
# pass's truncated manifest goes over upstream's.
[[dependencies]]
kind = "source"
source = "https://github.com/fosslinux/live-bootstrap"
revision = "git:sha1:b1ceced7ea8a819a26f23796f6dd7ae8496a33a4"
path = "/steps"
from = "steps"

# The distfiles this pass's steps check and unpack.

[[dependencies]]
kind = "file"
sha256 = "ae9a5789e23459e59606e6714723f2d3ffc31c03174191ef0d015bdf06007450"
path = "/external/distfiles/binutils-2.41.tar.xz"

[[dependencies]]
kind = "file"
sha256 = "25109543fdf46f397c347b5d8b7a2c7e5694a5a51cce4b9c6e1ea8a71ca307c1"
path = "/external/distfiles/gcc-10.5.0.tar.xz"

[[build.targets]]
name = "x86"
# Each step ends in upstream's own check of what it built.
command = ["/usr/bin/bash", "/kairo/src/start.sh", "build autogen-5.18.16 pass1.sh"]
# start.sh (../live-bootstrap/pass/) puts pass 4's root back as its
# steps left it and runs the generated script from the step after pass
# 4's last, named above; package.sh ships /usr, /etc, every package so
# far, and the state the next pass needs into /kairo/package, and
# extracts each package this pass made into /kairo/package/<package>/,
# a child object of its own.
#
# The children below are generated: ../live-bootstrap/children.py, from
# the packages this pass makes.


[[build.targets.children]]
name = "gcc-10.5.0_0"
root = "gcc-10.5.0_0"
summary = "gcc 10.5.0, as live-bootstrap builds it (package gcc-10.5.0_0), without its shared runtime libraries, which are children of their own."
tags = ["live-bootstrap"]
version = "10.5.0"
requires = [{ provides = "tool:binutils:i686-linux-musl" }, { provides = "lib:musl:headers" }, { one_of = [{ provides = "lib:musl:static" }, { provides = "lib:musl:shared" }] }, { provides = "lib:linux:headers" }]
provides = [{ provides = "tool:gcc" }, { provides = "tool:g++" }, { provides = "lib:stdc++:static" }, { provides = "tool:gcc:i686-linux-musl" }, { provides = "tool:g++:i686-linux-musl" }]

[[build.targets.children]]
name = "gcc-10.5.0_0-libstdc++"
root = "gcc-10.5.0_0-libstdc++"
summary = "gcc 10.5.0's shared libstdc++, as live-bootstrap builds it (package gcc-10.5.0_0)."
tags = ["live-bootstrap"]
version = "10.5.0"
requires = [{ provides = "lib:musl:shared" }, { provides = "lib:gcc:shared" }]
provides = [{ provides = "lib:stdc++:shared", confers = [{ provides = "lib:stdc++:shared", version = ">=10.5.0" }] }]

[[build.targets.children]]
name = "gcc-10.5.0_0-libgcc_s"
root = "gcc-10.5.0_0-libgcc_s"
summary = "gcc 10.5.0's shared libgcc_s, as live-bootstrap builds it (package gcc-10.5.0_0)."
tags = ["live-bootstrap"]
version = "10.5.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:gcc:shared", confers = [{ provides = "lib:gcc:shared", version = ">=10.5.0" }] }]

[[build.targets.children]]
name = "gcc-10.5.0_0-libgomp"
root = "gcc-10.5.0_0-libgomp"
summary = "gcc 10.5.0's shared libgomp, as live-bootstrap builds it (package gcc-10.5.0_0)."
tags = ["live-bootstrap"]
version = "10.5.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:gomp:shared", confers = [{ provides = "lib:gomp:shared", version = ">=10.5.0" }] }]

[[build.targets.children]]
name = "gcc-10.5.0_0-libatomic"
root = "gcc-10.5.0_0-libatomic"
summary = "gcc 10.5.0's shared libatomic, as live-bootstrap builds it (package gcc-10.5.0_0)."
tags = ["live-bootstrap"]
version = "10.5.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:atomic:shared", confers = [{ provides = "lib:atomic:shared", version = ">=10.5.0" }] }]

[[build.targets.children]]
name = "gcc-10.5.0_0-libitm"
root = "gcc-10.5.0_0-libitm"
summary = "gcc 10.5.0's shared libitm, as live-bootstrap builds it (package gcc-10.5.0_0)."
tags = ["live-bootstrap"]
version = "10.5.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:itm:shared", confers = [{ provides = "lib:itm:shared", version = ">=10.5.0" }] }]

[[build.targets.children]]
name = "gcc-10.5.0_0-libquadmath"
root = "gcc-10.5.0_0-libquadmath"
summary = "gcc 10.5.0's shared libquadmath, as live-bootstrap builds it (package gcc-10.5.0_0)."
tags = ["live-bootstrap"]
version = "10.5.0"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "lib:quadmath:shared", confers = [{ provides = "lib:quadmath:shared", version = ">=10.5.0" }] }]

[[build.targets.children]]
name = "binutils-2.41_1"
root = "binutils-2.41_1"
summary = "binutils 2.41, as live-bootstrap builds it (package binutils-2.41_1)."
tags = ["live-bootstrap"]
version = "2.41"
requires = [{ provides = "lib:musl:shared" }]
provides = [{ provides = "tool:binutils" }, { provides = "tool:binutils:i686-linux-musl" }]

# The whole root after this pass, for the pass that goes on from it;
# binutils 2.41 is built twice, so the label names the package.
[[provides]]
provides = "data:live-bootstrap:x86:binutils-2.41_1"
target = "x86"
