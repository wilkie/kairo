[[build.targets]]
name = "x86"
# Each step ends in upstream's own check of what it built.
command = ["/usr/bin/bash", "/kairo/src/start.sh", "uninstall perl-5.6.2 perl-5.8.9"]
# start.sh (../live-bootstrap/pass/) puts pass 2's root back as its
# steps left it and runs the generated script from the step after pass
# 2's last, named above; package.sh ships /usr, /etc, every package so
# far, and the state the next pass needs into /kairo/package, and
# extracts each package this pass made into /kairo/package/<package>/,
# a child object of its own.
#
# The children below are generated: ../live-bootstrap/children.py, from
# the packages this pass makes.


[[build.targets.children]]
name = "openssl-3.6.0_0"
root = "openssl-3.6.0_0"
summary = "openssl 3.6.0, as live-bootstrap builds it (package openssl-3.6.0_0)."
tags = ["live-bootstrap"]
version = "3.6.0"
provides = [{ provides = "lib:openssl" }, { provides = "tool:openssl" }]

[[build.targets.children]]
name = "ca-certificates-3.119.1_0"
root = "ca-certificates-3.119.1_0"
summary = "ca-certificates 3.119.1, as live-bootstrap builds it (package ca-certificates-3.119.1_0)."
tags = ["live-bootstrap"]
version = "3.119.1"
provides = [{ provides = "data:ca-certificates" }]

[[build.targets.children]]
name = "curl-8.17.0_1"
root = "curl-8.17.0_1"
summary = "curl 8.17.0, as live-bootstrap builds it (package curl-8.17.0_1)."
tags = ["live-bootstrap"]
version = "8.17.0"
provides = [{ provides = "tool:curl" }]

[[build.targets.children]]
name = "patch-2.8_0"
root = "patch-2.8_0"
summary = "patch 2.8, as live-bootstrap builds it (package patch-2.8_0)."
tags = ["live-bootstrap"]
version = "2.8"
provides = [{ provides = "tool:patch" }]

[[build.targets.children]]
name = "gcc-4.7.4_0"
root = "gcc-4.7.4_0"
summary = "gcc 4.7.4, as live-bootstrap builds it (package gcc-4.7.4_0)."
tags = ["live-bootstrap"]
version = "4.7.4"
requires = [{ provides = "tool:binutils:i686-linux-musl" }, { provides = "lib:musl:headers" }, { one_of = [{ provides = "lib:musl:static" }, { provides = "lib:musl:shared" }] }, { provides = "lib:linux:headers" }]
provides = [{ provides = "tool:gcc" }, { provides = "tool:g++" }, { provides = "lib:stdc++:static" }, { provides = "tool:gcc:i686-linux-musl" }, { provides = "tool:g++:i686-linux-musl" }]

[[build.targets.children]]
name = "binutils-2.41_0"
root = "binutils-2.41_0"
summary = "binutils 2.41, as live-bootstrap builds it (package binutils-2.41_0)."
tags = ["live-bootstrap"]
version = "2.41"
provides = [{ provides = "tool:binutils" }, { provides = "tool:binutils:i686-linux-musl" }]

[[build.targets.children]]
name = "musl-1.2.5_2-headers"
root = "musl-1.2.5_2-headers"
summary = "musl 1.2.5's headers part, as live-bootstrap builds it (package musl-1.2.5_2)."
tags = ["live-bootstrap"]
version = "1.2.5"
provides = [{ provides = "lib:musl:headers" }]

[[build.targets.children]]
name = "musl-1.2.5_2-static"
root = "musl-1.2.5_2-static"
summary = "musl 1.2.5's static part, as live-bootstrap builds it (package musl-1.2.5_2)."
