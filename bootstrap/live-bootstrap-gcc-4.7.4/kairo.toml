# live-bootstrap for x86, pass 3 (specs/DECISIONS.md §49): goes on from
# pass 2's whole root (bootstrap/live-bootstrap-perl/, through the perl
# chain) through openssl 3.6.0, ca-certificates, curl 8.17.0, and patch
# 2.8 to gcc 4.7.4, live-bootstrap's first gcc with C++, then binutils
# 2.41 and musl 1.2.5 rebuilt with it. It runs upstream's own scripts,
# generated by upstream's script generator from upstream's manifest
# truncated after that musl, from the step after pass 2's last. Every
# package it makes is checked against live-bootstrap's SHA256SUMS.pkgs.

[kairo]
schema = 1
kind = "software"
name = "live-bootstrap-x86-gcc-4.7.4"
summary = "live-bootstrap b1ceced7 for x86, pass 3: gcc 4.7.4 with C++, binutils 2.41, and musl 1.2.5 rebuilt, with openssl 3.6.0 and curl 8.17.0."
tags = ["bootstrap", "live-bootstrap"]

# As in pass 1: the guest is root, and / is live-bootstrap's.
[[dependencies]]
kind = "provides"
provides = "environment:linux/x86"

# Pass 2's whole root, installed at /: /usr and /etc, every package so
# far in /repo, and in /state what its steps left outside them.
[[dependencies]]
kind = "provides"
provides = "data:live-bootstrap:x86:perl-5.42.0"

# live-bootstrap's steps, at the commit the earlier passes ran; this
# pass's truncated manifest goes over upstream's.
[[dependencies]]
kind = "source"
source = "https://github.com/fosslinux/live-bootstrap"
revision = "git:sha1:b1ceced7ea8a819a26f23796f6dd7ae8496a33a4"
path = "/steps"
from = "steps"

