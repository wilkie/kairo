version = "1.2.5"
requires = [{ provides = "data:linux-filesystem:merged-usr" }]
provides = [{ provides = "lib:musl:shared", confers = [{ provides = "lib:musl:shared", version = "^1.2.5" }] }]

# The whole root after this pass, for the pass that goes on from it;
# musl-1.2.5 is built three times, so the label names the package.
[[provides]]
provides = "data:live-bootstrap:x86:musl-1.2.5_2"
target = "x86"
