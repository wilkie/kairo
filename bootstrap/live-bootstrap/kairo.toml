# The live-bootstrap bootstrap for x86, through its first gcc
# (specs/DECISIONS.md §38): a native object that runs live-bootstrap's
# own scripts, unmodified, from the archive's stage0-posix x86 artifact
# through Mes and tcc to make, the core utilities, and bash, then under
# bash to a tcc and musl toolchain, flex, bison, perl, the autotools,
# binutils, and gcc 4.0.4. Every input is pinned: live-bootstrap
# and M2libc as source objects by commit, each distfile as a file source
# by its SHA-256, and stage0-posix as the artifact its wrapper builds.
# Each step checks its distfiles and what it built against the
# checksums live-bootstrap publishes, so a success agrees with upstream.

[kairo]
schema = 1
kind = "software"
name = "live-bootstrap-x86"
summary = "live-bootstrap b1ceced7 for x86 through gcc 4.0.4: Mes, tcc, bash, musl, perl, the autotools, binutils, and gcc."

# The guest's / is this tree; live-bootstrap assumes it owns it.
[[dependencies]]
kind = "provides"
provides = "environment:linux-root/x86"

# live-bootstrap's steps, under the wrapper's bootstrap.cfg and
# truncated manifest, which win.
[[dependencies]]
kind = "source"
source = "https://github.com/fosslinux/live-bootstrap"
revision = "git:sha1:b1ceced7ea8a819a26f23796f6dd7ae8496a33a4"
path = "steps"
from = "steps"
overlay = true

# Its seed files; start.kaem copies them to /, as rootfs.py does.
[[dependencies]]
kind = "source"
source = "https://github.com/fosslinux/live-bootstrap"
revision = "git:sha1:b1ceced7ea8a819a26f23796f6dd7ae8496a33a4"
path = "seed"
from = "seed"

# stage0-posix's M2libc at Release_1.9.1, where seed.kaem's
# M2LIBC_PATH points.
[[dependencies]]
kind = "source"
source = "https://github.com/oriansj/M2libc"
revision = "git:sha1:68a23cfd05d5a355ba7a30c770d684cbe86fcc4e"
path = "M2libc"

# stage0-posix 1.9.1's x86 tools, built by its wrapper, where
# live-bootstrap's seed looks for them (/${ARCH_DIR}/bin).
[[dependencies]]
kind = "provides"
provides = "tool:kaem"
version = "1.9.1"
path = "x86"

