[[build.targets]]
name = "x86"
# Each step ends in upstream's own `sha256sum -c` of what it built.
command = ["/x86/bin/kaem", "--verbose", "--strict", "--file", "/start.kaem"]

[[build.targets.outputs]]
name = "usr"
path = "usr"
artifact_path = "usr"
kind = "directory"

# The packages the bash-run steps made, each checked against
# live-bootstrap's SHA256SUMS.pkgs.
[[build.targets.outputs]]
name = "repo"
path = "external/repo"
artifact_path = "repo"
kind = "directory"

