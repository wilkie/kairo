[[build.targets]]
name = "x86"
# Each step ends in upstream's own `sha256sum -c` of what it built.
command = ["/x86/bin/kaem", "--verbose", "--strict", "--file", "/kairo/src/start.kaem"]
# start.kaem copies /usr, and the packages the bash-run steps made, each
# checked against live-bootstrap's SHA256SUMS.pkgs, into /kairo/package
# (DECISIONS.md §41 sub-decision 2); the artifact installs at /. It also
# extracts each package into /kairo/package/<package>/, and each is a
# child object of its own (§41 sub-decision 6), installed at / with the
# labels of what it holds, so a consumer can take exactly live-bootstrap's
# bash, or its gcc and the toolchain beside it.
#
# The children below are generated: children.py, from the packages the
# build makes. The last revision of each package provides its label;
# earlier ones, which later steps rebuilt, are reachable by id.


